<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discord Staff Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1>Discord Staff Tracker</h1>
      <p class="muted">Private staff roles, attendance, excused absences, and weekly summaries.</p>
    </div>
    <div id="authBox"></div>
  </header>

  <main id="app" class="hidden">
    <nav id="tabs"></nav>
    <section id="view"></section>
  </main>

  <section id="loggedOut" class="card">
    <h2>Login required</h2>
    <p>No staff data is loaded until you sign in with an authorized Discord account.</p>
    <button id="loginBtn">Login with Discord</button>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
